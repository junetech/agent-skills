<!--
  diff-view.html — Annotated diff with margin notes and severity colors (document mode)

  WHEN TO USE: Source is a code review, PR writeup, or annotated change.
  Static HTML — no JS required. Shows added/removed lines with color coding
  and optional margin annotations.

  WHAT TO FILL:
  - Replace FILENAME with the file being diffed
  - Replace diff lines: use class "add" for additions, "del" for deletions, "ctx" for context
  - Add .mdh-diff-note elements for inline annotations
  - Set data-severity="high|med|low|info" on notes for color coding

  CLASS PREFIX: mdh-diff (no conflict with base.html classes)
-->
<style>
  .mdh-diff-file {
    margin: 16px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  .mdh-diff-header {
    background: #f3f2ec; padding: 8px 14px; font-family: ui-monospace, monospace;
    font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .mdh-diff-body { overflow-x: auto; }
  .mdh-diff-code { font-size: 12px; line-height: 1.5; background: #1f2024; }
  .mdh-diff-line { display: flex; }
  .mdh-diff-line .ln {
    width: 40px; min-width: 40px; text-align: right; padding: 0 8px;
    font-size: 11px; color: #666; user-select: none; border-right: 1px solid #333;
    line-height: 1.8;
  }
  .mdh-diff-line .code { padding: 0 12px; flex: 1; white-space: pre; line-height: 1.8; color: #e6e6e0; }
  .mdh-diff-line.add { background: rgba(30,122,58,.18); }
  .mdh-diff-line.add .code::before { content: "+"; color: #5fb37a; margin-right: 4px; }
  .mdh-diff-line.del { background: rgba(179,38,30,.18); }
  .mdh-diff-line.del .code { text-decoration: line-through; color: #999; }
  .mdh-diff-line.del .code::before { content: "-"; color: #e57373; margin-right: 4px; }
  .mdh-diff-line.ctx .code::before { content: " "; margin-right: 4px; }

  /* Margin annotations below the diff */
  .mdh-diff-notes { padding: 10px 14px; background: var(--surface); border-top: 1px solid var(--border); }
  .mdh-diff-note { font-size: 13px; padding: 6px 10px; margin: 5px 0; border-radius: 4px; border-left: 3px solid var(--border); }
  .mdh-diff-note[data-severity="high"] { border-left-color: var(--danger); background: var(--danger-bg); }
  .mdh-diff-note[data-severity="med"]  { border-left-color: var(--warn);   background: var(--warn-bg); }
  .mdh-diff-note[data-severity="low"]  { border-left-color: var(--ok);     background: var(--ok-bg); }
  .mdh-diff-note[data-severity="info"] { border-left-color: var(--accent);  background: var(--accent-soft); }
  .mdh-diff-note .line-ref { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); margin-right: 6px; }
</style>

<div class="mdh-diff-file">
  <div class="mdh-diff-header">
    <span>FILENAME</span>
    <span class="badge info">reviewed</span>
  </div>
  <div class="mdh-diff-body">
    <div class="mdh-diff-code">
      <div class="mdh-diff-line ctx"><span class="ln">1</span><span class="code">context line here</span></div>
      <div class="mdh-diff-line del"><span class="ln">2</span><span class="code">removed line here</span></div>
      <div class="mdh-diff-line add"><span class="ln">3</span><span class="code">added line here</span></div>
      <div class="mdh-diff-line ctx"><span class="ln">4</span><span class="code">context line here</span></div>
    </div>
  </div>
  <div class="mdh-diff-notes">
    <div class="mdh-diff-note" data-severity="high">
      <span class="line-ref">L3</span>Note text — what this change does and why it matters.
    </div>
    <div class="mdh-diff-note" data-severity="info">
      <span class="line-ref">L1</span>Context note — safe change.
    </div>
  </div>
</div>
